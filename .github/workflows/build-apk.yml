name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Accept Android SDK Licenses & Install Platform 36
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" || true

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        run: npm run build

      - name: Copy Web Assets to Android
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        id: build
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy & Rename APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk HistoriLex-Debug.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HistoriLex-APK
          path: HistoriLex-Debug.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: HistoriLex-Debug.apk
          tag_name: v1.0.0
          name: "HistoriLex Android APK v1.0.0"
          body: "دانلود مستقیم فایل نصبی اپلیکیشن تاریخ‌واژه (HistoriLex) برای گوشی‌های اندروید."
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
