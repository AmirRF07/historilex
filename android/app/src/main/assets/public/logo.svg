<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="terracotta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />
  <rect x="12" y="12" width="488" height="488" rx="92" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.35" stroke-dasharray="8 6" />

  <!-- Manuscript Arch (طاق محرابی ایرانی) -->
  <path d="M 136 380 L 136 210 C 136 140, 256 100, 256 100 C 256 100, 376 140, 376 210 L 376 380" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Astrolabe / Celestial Coordinates (اسطرلاب و زمان‌نگاری) -->
  <circle cx="256" cy="240" r="110" fill="none" stroke="url(#gold)" stroke-width="2" stroke-opacity="0.25" />
  <circle cx="256" cy="240" r="80" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.3" />
  <line x1="256" y1="120" x2="256" y2="360" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.2" />
  <line x1="136" y1="240" x2="376" y2="240" stroke="url(#gold)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Open Manuscript Scroll / Book (کتاب و طومار کهن) -->
  <path d="M 160 330 C 200 315, 235 330, 256 345 C 277 330, 312 315, 352 330 L 352 230 C 312 215, 277 230, 256 245 C 235 230, 200 215, 160 230 Z" fill="#1e293b" stroke="url(#gold)" stroke-width="4" filter="url(#glow)" />
  <path d="M 256 245 L 256 345" stroke="url(#gold)" stroke-width="3" />

  <!-- Historic Calligraphy Quill / Pen (کِلک / قلم پژوهشگر تاریخ) -->
  <g transform="translate(256,220) rotate(-40) translate(-256,-220)">
    <!-- Feather spine & plume -->
    <path d="M 256 80 C 272 130, 285 200, 260 290 L 252 290 C 235 200, 244 130, 256 80 Z" fill="url(#gold)" />
    <!-- Nib tip -->
    <polygon points="256,330 250,290 262,290" fill="#f8fafc" />
    <line x1="256" y1="290" x2="256" y2="322" stroke="#0f172a" stroke-width="2" />
    <!-- Golden ink droplet -->
    <circle cx="256" cy="342" r="5" fill="url(#gold)" />
  </g>

  <!-- Star of Clio (ستاره کلایو / الهه تاریخ) -->
  <polygon points="256,128 261,142 276,142 264,151 268,165 256,156 244,165 248,151 236,142 251,142" fill="url(#gold)" />

  <!-- App Title Typography in SVG -->
  <text x="256" y="420" font-family="'Vazirmatn', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#f8fafc" text-anchor="middle" letter-spacing="1">HistoriLex</text>
  <text x="256" y="452" font-family="'Vazirmatn', -apple-system, Tahoma, sans-serif" font-size="19" font-weight="500" fill="#d97706" text-anchor="middle">تـاریـخ‌واژه</text>
</svg>
